name: Update profile metrics

on:
  # Refresh once an hour so activity in other repositories is picked up too.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/generate-profile.mjs"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: TW1ST3RX10
        run: node scripts/generate-profile.mjs

      - name: Commit updated SVGs
        run: |
          if git diff --quiet -- assets/activity.svg assets/contributions.svg; then
            echo "Profile SVGs are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg assets/contributions.svg
          git commit -m "chore: update profile metrics"
          git push
